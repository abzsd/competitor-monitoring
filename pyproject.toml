[project]
name = "competitor-monitoring"
version = "0.1.0"
description = "Agentic competitor monitoring system powered by OpenClaw"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.8",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "deepdiff>=7.0",
    "xxhash>=3.4",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "openai>=1.50",
    "selenium>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mongomock>=4.1",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/competitor-monitoring/scripts"]
markers = [
    "integration: marks tests requiring external services",
]

[tool.ruff]
line-length = 120
target-version = "py312"
