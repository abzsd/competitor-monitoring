# Detection settings
detection:
  # Ignore changes smaller than this ratio of total content
  min_text_change_ratio: 0.01
  severity_rules:
    # Price changes above this threshold are CRITICAL
    critical_price_change_threshold: 0.20
  partnership_keywords:
    - "partnership"
    - "integration"
    - "collaboration"
    - "powered by"
    - "works with"
    - "acquisition"
    - "acquired"

# Alert settings (Slack only)
alerts:
  channel: "slack"
  # Minimum severity to trigger alerts (low, medium, high, critical)
  min_severity: "medium"
  # Max alerts per hour to prevent spam
  max_per_hour: 10

# Source discovery settings
discovery:
  max_crawl_depth: 2
  relevant_paths:
    - "/pricing"
    - "/plans"
    - "/product"
    - "/features"
    - "/partners"
    - "/integrations"
    - "/blog"
    - "/changelog"
    - "/about"
