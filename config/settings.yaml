# Competitor Monitoring Configuration
# Edit this file to add/modify competitors and their monitored sources.

competitors:
  # Test competitor — deployed on Render
  - name: "TestRival"
    slug: "testrival"
    domain: "testrival-mock.onrender.com"
    industry: "project-management"
    description: "Mock competitor for testing the monitoring pipeline"
    tags: ["pm", "saas", "ai"]
    sources:
      - url: "https://testrival-mock.onrender.com/pricing"
        page_type: "pricing"
        scrape_method: "static"
        schedule_group: "hourly"
      - url: "https://testrival-mock.onrender.com/product"
        page_type: "product"
        scrape_method: "static"
        schedule_group: "daily"
      - url: "https://testrival-mock.onrender.com/partners"
        page_type: "partnerships"
        scrape_method: "static"
        schedule_group: "daily"
      - url: "https://testrival-mock.onrender.com/blog"
        page_type: "blog"
        scrape_method: "static"
        schedule_group: "daily"

